<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guadalmina Golf Booking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Resort booking</p>
          <h1>Guadalmina Golf</h1>
        </div>
        <div class="chip">Open bookings</div>
      </header>

      <main class="layout">
        <section class="panel form-panel">
          <div class="stepper" aria-label="Booking steps">
            <span class="step active">1</span>
            <span class="step">2</span>
            <span class="step">3</span>
          </div>

          <form id="booking-form" novalidate>
            <section class="form-step active" data-step="1">
              <h2>Select your round</h2>

              <div class="field-group">
                <label for="course">Course</label>
                <select id="course" name="course">
                  <option value="north">North Course</option>
                  <option value="south">South Course</option>
                  <option value="signature">Signature 18</option>
                </select>
              </div>

              <div class="two-col">
                <div class="field-group">
                  <label for="date">Date</label>
                  <input id="date" name="date" type="date" required />
                </div>

                <div class="field-group">
                  <label for="players">Players</label>
                  <select id="players" name="players">
                    <option value="1">1 player</option>
                    <option value="2" selected>2 players</option>
                    <option value="3">3 players</option>
                    <option value="4">4 players</option>
                  </select>
                </div>
              </div>

              <div class="field-group">
                <label for="time">Preferred tee time</label>
                <select id="time" name="time"></select>
              </div>
            </section>

            <section class="form-step" data-step="2">
              <h2>Your details</h2>

              <div class="field-group">
                <label for="name">Full name</label>
                <input id="name" name="name" type="text" placeholder="Your name" required />
              </div>

              <div class="two-col">
                <div class="field-group">
                  <label for="email">Email</label>
                  <input id="email" name="email" type="email" placeholder="you@example.com" required />
                </div>

                <div class="field-group">
                  <label for="phone">Phone</label>
                  <input id="phone" name="phone" type="tel" placeholder="+34 600 000 000" required />
                </div>
              </div>

              <div class="field-group">
                <label for="notes">Special requests</label>
                <textarea id="notes" name="notes" rows="4" placeholder="Cart, caddie, club hire, celebration, etc."></textarea>
              </div>
            </section>

            <section class="form-step" data-step="3">
              <h2>Review & confirm</h2>
              <div class="summary-box">
                <dl id="summary"></dl>
              </div>
            </section>

            <div class="actions">
              <button type="button" class="secondary hidden" id="back-btn">Back</button>
              <button type="button" class="primary" id="next-btn">Next</button>
              <button type="submit" class="primary hidden" id="confirm-btn">Confirm booking</button>
            </div>
          </form>
        </section>

        <aside class="panel info-panel">
          <h3>Booking overview</h3>
          <ul class="feature-list">
            <li>Flexible tee times from 07:30 to 17:30</li>
            <li>Green fees and cart suggestions included</li>
            <li>Instant summary before confirmation</li>
          </ul>

          <div class="price-box">
            <span class="label">Estimated total</span>
            <strong id="price-total">€0</strong>
          </div>
        </aside>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
